[package]
name = "timelauncher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
comfy-table = "7.2.2"
compact_str = { version = "0.9.0", features = ["serde"] }
console = "0.16.3"
dirs = "6.0.0"
fd-lock = "4.0.4"
humantime = "2.3.0"
indicatif = "0.18.4"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["serde_derive", "derive"] }
serde_json = "1.0.149"
shlex = "2.0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"         
lto = "fat"          
codegen-units = 1     
strip = true          
panic = "abort"       
